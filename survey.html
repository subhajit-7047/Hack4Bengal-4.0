<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindCare | Initial Survey</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6C5CE7;
            --gradient-primary: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%);
            --light: #FFFFFF;
            --dark: #2D3436;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--gradient-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .survey-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }

        .question-slide {
            display: none;
            opacity: 0;
            transform: translateX(50px);
            transition: all 0.5s ease;
        }

        .question-slide.active {
            display: block;
            opacity: 1;
            transform: translateX(0);
        }

        h2 {
            color: var(--dark);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .question {
            margin-bottom: 2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--dark);
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid rgba(108, 92, 231, 0.2);
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        .btn {
            background: var(--gradient-primary);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }

        .progress-bar {
            height: 4px;
            background: rgba(108, 92, 231, 0.2);
            margin-bottom: 2rem;
            border-radius: 2px;
        }

        .progress {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="survey-container">
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <form id="surveyForm">
            <div class="question-slide active" data-question="1">
                <h2>Welcome to MindCare</h2>
                <div class="question">
                    <label for="age">What's your age?</label>
                    <input type="number" id="age" required min="13" max="100">
                </div>
                <button type="button" class="btn" onclick="nextQuestion()">Next</button>
            </div>

            <div class="question-slide" data-question="2">
                <h2>Help Us Understand You Better</h2>
                <div class="question">
                    <label>What brings you to MindCare today?</label>
                    <select id="reason" required>
                        <option value="">Select a reason</option>
                        <option value="anxiety">Anxiety</option>
                        <option value="depression">Depression</option>
                        <option value="stress">Stress Management</option>
                        <option value="relationship">Relationship Issues</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <button type="button" class="btn" onclick="previousQuestion()">Previous</button>
                <button type="button" class="btn" onclick="nextQuestion()">Next</button>
            </div>

            <div class="question-slide" data-question="3">
                <h2>Your Expectations</h2>
                <div class="question">
                    <label>What do you hope to achieve with MindCare?</label>
                    <textarea id="expectations" rows="4" required></textarea>
                </div>
                <button type="button" class="btn" onclick="previousQuestion()">Previous</button>
                <button type="button" class="btn" onclick="nextQuestion()">Next</button>
            </div>

            <div class="question-slide" data-question="4">
                <h2>Mental Health History</h2>
                <div class="question">
                    <label>Have you experienced any psychological challenges before?</label>
                    <select id="history" required>
                        <option value="">Please select</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                        <option value="maybe">Not sure</option>
                    </select>
                </div>
                <button type="button" class="btn" onclick="previousQuestion()">Previous</button>
                <button type="submit" class="btn">Complete Survey</button>
            </div>
        </form>
    </div>

    <script>
        let currentQuestion = 1;
        const totalQuestions = 4;

        function updateProgress() {
            const progress = ((currentQuestion - 1) / totalQuestions) * 100;
            document.getElementById('progress').style.width = `${progress}%`;
        }

        function showQuestion(questionNumber) {
            document.querySelectorAll('.question-slide').forEach(slide => {
                slide.classList.remove('active');
            });
            document.querySelector(`[data-question="${questionNumber}"]`).classList.add('active');
            currentQuestion = questionNumber;
            updateProgress();
        }

        function nextQuestion() {
            if (currentQuestion < totalQuestions) {
                showQuestion(currentQuestion + 1);
            }
        }

        function previousQuestion() {
            if (currentQuestion > 1) {
                showQuestion(currentQuestion - 1);
            }
        }

        document.getElementById('surveyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            try {
                const loadingBtn = document.querySelector('button[type="submit"]');
                loadingBtn.disabled = true;
                loadingBtn.textContent = 'Saving...';

                const surveyData = {
                    age: document.getElementById('age').value,
                    reason: document.getElementById('reason').value,
                    expectations: document.getElementById('expectations').value,
                    history: document.getElementById('history').value,
                    completedAt: new Date().toISOString()
                };

                // Get user data
                const userData = JSON.parse(localStorage.getItem('userData') || '{}');
                
                // Update user data
                userData.surveyCompleted = true;
                userData.firstLogin = false;
                localStorage.setItem('userData', JSON.stringify(userData));
                
                // Save survey data
                localStorage.setItem('surveyCompleted', 'true');
                localStorage.setItem('lastSurveyDate', new Date().toISOString());
                localStorage.setItem('surveyData', JSON.stringify(surveyData));

                // Show completion message
                alert('Thank you for completing the survey! We will now take you to your dashboard.');
                
                // Redirect to index
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Error saving survey:', error);
                alert('There was an error saving your responses. Please try again.');
            }
        });

        // Add input validation to prevent empty submissions
        function validateAndNext(questionNumber) {
            const currentSlide = document.querySelector(`[data-question="${questionNumber}"]`);
            const inputs = currentSlide.querySelectorAll('input, select, textarea');
            let isValid = true;

            inputs.forEach(input => {
                if (input.required && !input.value.trim()) {
                    isValid = false;
                    input.style.borderColor = '#ff4757';
                }
            });

            if (isValid) {
                nextQuestion();
            } else {
                alert('Please fill in all required fields.');
            }
        }

        // Update all next buttons to use validation
        document.querySelectorAll('.question-slide button.btn').forEach(button => {
            if (button.textContent === 'Next') {
                button.onclick = () => validateAndNext(currentQuestion);
            }
        });

        updateProgress();
    </script>
</body>
</html>
